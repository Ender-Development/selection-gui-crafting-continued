# Dependencies
#
# Format:
#   LABEL = [FLAGS#]group:artifact:version
#
# LABEL
#   Only a human-readable name that describes what the dependency does, since the
#   coordinates alone often don't say. It has no effect on the build.
#
# FLAGS (optional)
#   Letters placed before the '#'. They are case-insensitive, but uppercase is
#   preferred for readability. The order of the letters does not matter.
#
#   R   RuntimeOnly: the dependency is only added to the runtime classpath, not to compile classpath.
#   D   DeObfuscate: the dependency is deobfuscated before being added (for obfuscated mod jars, e.g. CurseForge or Modrinth).
#   T   Transitive:  also resolve the dependency's own dependencies.
#   C   Changing:    treat the artifact as changing (e.g. snapshots), so it is not cached permanently.
#
#   Rules:
#   - R and D are incompatible. A runtimeOnly dependency needs no deobfuscation, so do not combine them.
#   - D cannot be combined with T or C.
#   - T and C can be combined with each other and with R, e.g. RTC#...
#
# Without FLAGS (no '#'), a dependency is added as plain Implementation
# with Transitive=false and Changing=false.
#
# Supported notations (all use the same Gradle coordinate format):
#   Regular Maven:    group:artifact:version
#   CurseMaven:       curse.maven:<name>-<projectId>:<fileId>
#   Modrinth Maven:   maven.modrinth:<projectId>:<versionId>
#
# Examples (the entries below):
#   DEVELOPER_TOOLS     Curse Maven, runtimeOnly
#   FASTER_WORLD_LOAD   Modrinth Maven, runtimeOnly
#   CTM                 regular Maven, runtimeOnly
