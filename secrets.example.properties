# =====================================================================================
#  SECRETS (EXAMPLE FILE)
# =====================================================================================
#  THIS IS AN EXAMPLE FILE. RENAME IT TO `secrets.properties` AND FILL IN THE VALUES.
#  DO NOT COMMIT `secrets.properties` TO VERSION CONTROL. (.gitignore ALREADY INCLUDES IT)
#
#  Format:
#    KEY = value
#
#  Notes:
#  - Only fill in what you need. Leave a value empty if you don't use that feature,
#    e.g. skip the publishing sections if you never publish from this machine.
#  - Never share these values or paste them into issues, logs or screenshots.
#  - If a secret leaks, revoke it on the respective website and create a new one.
#  - Keys are uppercase because they can also be provided as environment variables of
#    the same name (e.g. in CI). An environment variable takes precedence over this file.
#
#  Sections:
#    1. Minecraft          development environment
#    2. Publishing         CurseForge and Modrinth uploads
#    3. Maven Publishing   credentials for the maven repository
# =====================================================================================

# ---- 1. Minecraft -------------------------------------------------------------------

# The username used when running the game from your development environment.
DEV_USERNAME =

# ---- 2. Publishing ------------------------------------------------------------------

# API token for CurseForge, used to upload your mod files.
# Create one in your CurseForge account settings under "API tokens".
CURSEFORGE_TOKEN =

# API token for Modrinth, used to upload your mod files.
# The token must have the `CREATE_VERSION` and `PROJECT_WRITE` permissions.
# Create one in your Modrinth account settings under "Personal access tokens".
MODRINTH_TOKEN =

# ---- 3. Maven Publishing ------------------------------------------------------------

# Credentials for the maven repository your artifacts are published to.
MAVEN_USERNAME =
MAVEN_PASSWORD =
