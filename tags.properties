# =====================================================================================
#  TAGS
# =====================================================================================
#  Every entry in this file is turned into a constant in a generated class that you can
#  use in your code: a Kotlin object ({ModName}Reference) or a Java class (Tags).
#  This lets you access values such as the mod id or the version without hardcoding them.
#
#  Format:
#    CONSTANT_NAME = value
#
#  Notes:
#  - The key becomes the name of the constant, so use UPPER_SNAKE_CASE and a valid
#    identifier (letters, digits and underscores, not starting with a digit).
#  - The value becomes the constant's value. It is always a String.
#  - Values can reference other properties with ${name}, e.g. ${mod_id}. References are
#    evaluated by the buildscript at runtime, so any property from gradle.properties or
#    mod.properties can be used.
#  - Plain text is allowed too (see KOTLIN_LANGUAGE_ADAPTER). Do not use double quotes (")
#    or backslashes (\) in values, since they are written into generated source code.
#  - The generated class is overwritten on every build. Never edit it by hand, change
#    this file instead.
#  - You can add your own entries or remove the ones you don't need.
#
#  Sections:
#    1. Mod            identity of your mod
#    2. Kotlin         Kotlin and Forgelin
#    3. Libraries      versions of the libraries the mod depends on
# =====================================================================================

# ---- 1. Mod -------------------------------------------------------------------------

VERSION = ${mod_version}
MOD_ID = ${mod_id}
MOD_NAME = ${mod_name}
AUTHOR = ${mod_authors}

# ---- 2. Kotlin ----------------------------------------------------------------------

KOTLIN_VERSION = ${kotlin_version}
FORGELIN_VERSION = ${forgelin_continuous_version}
KOTLIN_LANGUAGE_ADAPTER = io.github.chaosunity.forgelin.KotlinAdapter

# ---- 3. Libraries -------------------------------------------------------------------

GROOVY_VERSION = ${groovy_version}
GROOVYSCRIPT_VERSION = ${groovyscript_version}
CRAFTTWEAKER_VERSION = ${crafttweaker_version}
HADENOUGHITEMS_VERSION = ${hei_version}
THEONEPROBE_VERSION = ${top_version}
CATALYX_VERSION = ${catalyx_version}
CONFIGANYTIME_VERSION = ${configanytime_version}
ASSETMOVER_VERSION = ${assetmover_version}
MIXINBOOTER_VERSION = ${mixin_booter_version}
