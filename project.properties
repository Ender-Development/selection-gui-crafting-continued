readme = <a href='https://www.akliz.net/enderman'><img src='https://raw.githubusercontent.com/Ender-Development/.github/refs/heads/master/assets/ender-development/banner.png' alt='Promotional Banner'/></a><br><br>\
  This is a fork of [Selection GUI Crafting](https://www.curseforge.com/minecraft/mc-mods/selection-gui-crafting) by [Gliese_832_c](https://www.curseforge.com/members/gliese_832_c). \
  It provides a few improvements to the original mod and also adds support for [GroovyScript](https://www.curseforge.com/minecraft/mc-mods/groovyscript).<br><br>\
  ![](title.png)<br><br>\
  ## Description<br>\
  Minecraft 1.12.2 mod that gives modpack authors the ability to add crafting recipes into a selection GUI that is triggered by right-clicking while holding the right items.<br>\
  This could, for example, be used for clay recipes. Instead of manually arranging clay balls in a different way in a crafting table, it would be possible to make it so that you right-click with a spatula in one hand, \
  clay in the other, and just select the clay item you want to make.<br>\
  Another use example would be forging. Right-click with a hammer in one hand, an ingot in the other, and select your desired tool head.<br>\
  ### Fork? Rewrite! (Version 2.0.0+)<br>\
  What started as a fork of the original mod, quickly turned into a rewrite. The original crafting system felt way to clunky and not user-friendly. The new system is much more intuitive and user-friendly. \
  It also allows much more customization and is more flexible to benefit the needs of modpack developers. An added bonus is the support for GroovyScript. The old CraftTweaker support was rewritten as well to reflect the new system.<br>\
  ### Re-Rewrite! (Version 3.0.0+)<br>\
  Yep another rewrite. Now I finally took the time to transform the mod into something much more modular. So now GUIs can be opened either by items or blocks, each 'trigger' can tweaks the overall stats of the recipes. \
  Additionally, there are now ways to restrict recipes, for example you can now lock recipes behind Game Stages, Reskillable skill levels and even advancements. \
  Furthermore, I added the possibility to execute a set of commands if the general recipe builder wasn't powerful enough. This update also comes with an overhauled JEI integration and various other quality of life improvements!

