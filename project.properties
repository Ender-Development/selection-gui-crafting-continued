# =====================================================================================
#  MOD PROPERTIES
# =====================================================================================
#  This file is meant to be edited. Fill in the properties below to describe your mod.
#  The buildscript reads them to generate mod metadata (mcmod.info), the README and
#  publishing information.
#
#  Format:
#    key = value
#
#  Notes:
#  - Properties with an empty value must be filled in before the first build.
#  - Values can reference other properties with ${name}, e.g. ${mod_id}. References are
#    evaluated by the buildscript at runtime.
#  - Do not rename or remove properties. Only change their values.
#  - For lists (authors, credits), separate the entries with commas.
#  - This file is never touched by buildscript updates (./gradlew updateBuildScript),
#    so your values are safe.
#
#  Sections:
#    1. Identity     package, id, name and version of the mod
#    2. Metadata     description, links, authors, credits and logo
#    3. README       values used by the README.md generator
# =====================================================================================

# ---- 1. Identity --------------------------------------------------------------------

# The root package for your mod's main class. Change this to your own package.
# This should match the directory structure of your main class.
root_package = org.ender_development

# The mod id is a unique identifier for your mod. It must be all lowercase and contain no spaces.
mod_id = selectionguicrafting

# The mod name is the display name for your mod. This can contain spaces and capitalization.
mod_name = Selection GUI Crafting

# ---- 2. Metadata --------------------------------------------------------------------

# A short description of your mod.
mod_description = A mod that gives modpack authors the ability to add crafting recipes into a selection GUI that is triggered by right-clicking while holding the right items.

# The URL to the mod's homepage or GitHub repository.
mod_url = https://www.curseforge.com/minecraft/mc-mods/selectiongui-crafting-continued

# Authors of the mod. Separate multiple authors with commas.
mod_authors = Ender-Development.org

# Credits for the mod. Separate multiple credits with commas.
mod_credits = MasterEnderman, gliese832c (Original Author)

# The logo path for the mod. This should be a path to a PNG file within the assets folder of your mod.
mod_logo_path = assets/${mod_id}/textures/logo.png

# ---- 3. README ----------------------------------------------------------------------

# Values for the README.md generator.
# The license of your mod as an SPDX identifier, e.g. LGPL-3.0 or MIT.
# Full list: https://spdx.org/licenses/
# It is shown as the license shield in the README, which links to the LICENSE file in
# your repository, so make sure that file exists.
license = MIT

